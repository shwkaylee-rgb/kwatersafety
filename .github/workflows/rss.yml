# 게시판 글로 RSS 피드(rss.xml)를 다시 만들고, 바뀌었을 때만 main에 커밋합니다.
# Firestore posts는 공개 읽기라 비밀값이 필요 없습니다. 수동 실행: Actions 탭 > RSS 피드 갱신 > Run workflow
name: RSS 피드 갱신

on:
  schedule:
    - cron: '17 */2 * * *'   # 2시간마다 (UTC, 정각 혼잡을 피해 17분)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build-rss.mjs', '.github/workflows/rss.yml']

permissions:
  contents: write

concurrency:
  group: rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-rss.mjs
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- rss.xml && git ls-files --error-unmatch rss.xml >/dev/null 2>&1; then
            echo "rss.xml 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git commit -m "RSS 피드 갱신 (자동)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
